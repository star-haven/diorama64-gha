name: Release build

# Fired by diorama64's release workflow on Tangled, since Spindle has no macOS
# runner (and Windows builds are unsigned, so it's simpler to build those here
# too rather than fight Wine cross-compilation on Spindle). This repo carries
# no source of its own - it just clones diorama64 at the tag it's told to build,
# packages it, and uploads the result to the same bucket the Linux release
# already lives in.
#
# workflow_dispatch is for manually re-running a build (e.g. to debug a
# failure) without needing a real release tag. dry_run skips the upload/prune
# steps so a manual run can't clobber the production update feed.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Branch or tag of diorama64 to build"
        default: main
      dry_run:
        description: "Skip uploading to object storage"
        type: boolean
        default: true

jobs:
  mac:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Check out diorama64 at the release tag
        run: git clone --branch "$TAG" --depth 1 https://knot.starhaven.dev/did:plc:pth3dl3uhjhrdzj7su65ywg6 diorama64

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: diorama64/yarn.lock

      - uses: actions/setup-python@v5
        with:
          # node-gyp needs distutils, which newer Pythons dropped.
          python-version: "3.11"

      - name: Cache Electron and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/node-gyp
          key: ${{ runner.os }}-electron-${{ hashFiles('diorama64/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        working-directory: diorama64
        env:
          # @vscode/ripgrep downloads a release asset from GitHub; unauthenticated
          # requests from Actions' shared IPs get rate-limited into a 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: diorama64
        run: yarn build

      - name: Install cmake and ninja for building ares from source
        run: brew install cmake ninja

      - name: Cache patched ares build
        uses: actions/cache@v4
        with:
          path: diorama64/app/resources/ares
          key: ${{ runner.os }}-ares-${{ hashFiles('diorama64/nix/ares/*.patch') }}-${{ hashFiles('diorama64/app/scripts/download-ares.mjs') }}

      - name: Package, notarize, and publish
        working-directory: diorama64
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        # electron-builder.yml's publish config uploads directly and writes
        # latest-mac.yml + app-update.yml.
        # A GitHub secret that isn't set comes through as an empty string, not an
        # unset var - electron-builder treats a non-empty (if empty-valued)
        # CSC_LINK as a real cert path and fails, so drop it entirely when blank.
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          publish=always
          if [ "$DRY_RUN" = "true" ]; then publish=never; fi
          yarn --cwd app package:mac --publish "$publish"

      - name: Prune old releases
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          # Each version produces 2 files (dmg + zip), both named
          # Diorama64-<version>.<ext>. Keep the newest 3 versions,
          # delete every file belonging to any older one.
          keep=3
          endpoint="https://fsn1.your-objectstorage.com"

          versions=$(aws s3api list-objects-v2 \
            --bucket starhaven \
            --prefix diorama64/releases/ \
            --endpoint-url "$endpoint" \
            --query 'Contents[].Key' \
            --output text \
            | tr '\t' '\n' \
            | grep -E '\.(dmg|zip)$' \
            | sed -E 's#.*Diorama64-(.+)\.(dmg|zip)$#\1#' \
            | sort -uV)

          stale=$(echo "$versions" | head -n "-$keep" || true)

          if [ -z "$stale" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          while read -r version; do
            echo "Pruning $version"
            aws s3 rm "s3://starhaven/diorama64/releases/" --endpoint-url "$endpoint" \
              --recursive --exclude "*" --include "Diorama64-${version}-*"
          done <<<"$stale"

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Check out diorama64 at the release tag
        run: git clone --branch "$env:TAG" --depth 1 https://knot.starhaven.dev/did:plc:pth3dl3uhjhrdzj7su65ywg6 diorama64

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: diorama64/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ilammy/msvc-dev-cmd@v1

      # ares's own CI validates the "windows-ci-mingw-native" preset with
      # MSYS2 clang64, not raw MSVC, so building the patched fork from source
      # uses that same toolchain. path-type stays "minimal" (the default) so
      # MSYS2's own `tar` doesn't shadow Windows' native one on PATH for every
      # other step - download-ares.mjs reaches into C:\msys64\clang64\bin
      # itself for just the commands that need it (see MSYS2_CLANG64_BIN).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-toolchain
            patch

      - name: Cache Electron and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
            ${{ env.LOCALAPPDATA }}\node-gyp\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('diorama64/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache patched ares build
        uses: actions/cache@v4
        with:
          path: diorama64/app/resources/ares
          key: ${{ runner.os }}-ares-${{ hashFiles('diorama64/nix/ares/*.patch') }}-${{ hashFiles('diorama64/app/scripts/download-ares.mjs') }}

      - name: Install dependencies
        working-directory: diorama64
        env:
          # @vscode/ripgrep downloads a release asset from GitHub; unauthenticated
          # requests from Actions' shared IPs get rate-limited into a 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: diorama64
        run: yarn build

      - name: Package and publish
        working-directory: diorama64
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        # Unsigned: no CSC_LINK. electron-builder.yml's publish config uploads
        # directly and writes latest.yml + app-update.yml.
        shell: bash
        run: |
          publish=always
          if [ "$DRY_RUN" = "true" ]; then publish=never; fi
          yarn --cwd app package:win --publish "$publish"

      - name: Prune old releases
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # Each version produces 2 files (x64 + arm64), both named
          # Diorama64-<version>-<arch>-Setup.exe. Keep the newest 3
          # versions, delete every file belonging to any older one.
          keep=3
          endpoint="https://fsn1.your-objectstorage.com"

          versions=$(aws s3api list-objects-v2 \
            --bucket starhaven \
            --prefix diorama64/releases/ \
            --endpoint-url "$endpoint" \
            --query 'Contents[].Key' \
            --output text \
            | tr '\t' '\n' \
            | grep -E '\-Setup\.exe$' \
            | sed -E 's#.*Diorama64-(.+)-(x64|arm64)-Setup\.exe$#\1#' \
            | sort -uV)

          stale=$(echo "$versions" | head -n "-$keep" || true)

          if [ -z "$stale" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          while read -r version; do
            echo "Pruning $version"
            aws s3 rm "s3://starhaven/diorama64/releases/" --endpoint-url "$endpoint" \
              --recursive --exclude "*" --include "Diorama64-${version}-*"
          done <<<"$stale"
