name: Build papermario-dx toolchains

# Fired by papermario-dx's Tangled pipeline on every push to main, which only
# builds the aarch64-linux unix-toolchain itself (the one thing native to its
# own host, kuribo). This repo carries no source of its own - it just clones
# papermario-dx at the given commit, builds the pieces that need real
# x86_64/macOS hardware (Windows toolchain, clangd index, x86_64-linux
# toolchain, aarch64-darwin toolchain), and publishes them to the same
# content-addressed S3 bucket the aarch64-linux build already lives in.
#
# Toolchains are stored by the sha256 of their zip, not by commit or tag, and
# deduplicated: a commit whose toolchain-relevant inputs didn't change reuses
# the existing blob. Each commit gets a small manifest object (one per
# platform) pointing at that hash, which is what
# tools/unix/download_toolchain.sh and tools/windows/download_toolchain.bat
# actually resolve against.
#
# Cloning from the Tangled knot (rather than GitHub) means nothing here
# needs to change if papermario-dx's canonical host ever moves.
#
# workflow_dispatch is for manually re-running a build (e.g. to debug a
# failure) without needing a real push.
on:
  repository_dispatch:
    types: [papermario-dx-release]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of papermario-dx to build"
        required: true

env:
  SHA: ${{ github.event.client_payload.sha || inputs.sha }}
  REPO_URL: https://knot.starhaven.dev/did:plc:dfsxnyhzxwqpmykryrjtjabz
  S3_ENDPOINT: https://fsn1.your-objectstorage.com

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out papermario-dx at the given commit
        run: |
          git clone --branch dx-scratch-test-1 --single-branch --depth 100 "$REPO_URL" papermario-dx
          git -C papermario-dx checkout "$SHA"

      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: papermario-dx
          authToken: "${{ secrets.PAPERMARIO_DX_CACHIX_AUTH_TOKEN }}"

      - name: Build Windows toolchain
        working-directory: papermario-dx
        run: nix build .#windows-toolchain --out-link result-windows-toolchain

      - name: Download base ROM
        # Only clangd-index needs this - it runs a real build to generate
        # compile_commands.json for indexing. windows-toolchain and
        # unix-toolchain just package the compiler/tools themselves.
        working-directory: papermario-dx
        run: |
          curl -L "$BASEROM_US_URL" -o papermario.us.z64
          nix-store --add-fixed sha256 papermario.us.z64
        env:
          BASEROM_US_URL: ${{ secrets.PAPERMARIO_DX_BASEROM_US_URL }}

      - name: Build clangd index
        working-directory: papermario-dx
        run: nix build .#clangd-index --out-link result-clangd-index

      - name: Build x86_64-linux toolchain
        working-directory: papermario-dx
        run: nix build .#unix-toolchain --out-link result-toolchain-x86_64-linux

      - name: Publish to S3
        working-directory: papermario-dx
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          bucket="s3://starhaven/papermario-dx"
          publish() {
            file="$1"; key="$2"; ext="$3"
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            if ! aws s3api head-object --bucket starhaven --key "papermario-dx/toolchains/$hash.$ext" --endpoint-url "$S3_ENDPOINT" >/dev/null 2>&1; then
              aws s3 cp "$file" "$bucket/toolchains/$hash.$ext" --endpoint-url "$S3_ENDPOINT"
            fi
            echo "$hash" | aws s3 cp - "$bucket/commits/$SHA/$key" --endpoint-url "$S3_ENDPOINT"
          }
          publish result-windows-toolchain/papermario-dx-windows.zip windows zip
          publish result-clangd-index/papermario-dx.idx clangd-index idx
          publish result-toolchain-x86_64-linux/papermario-dx-linux-x86_64.zip linux-x86_64 zip

  mac:
    runs-on: macos-15
    steps:
      - name: Check out papermario-dx at the given commit
        run: |
          git clone --branch dx-scratch-test-1 --single-branch --depth 100 "$REPO_URL" papermario-dx
          git -C papermario-dx checkout "$SHA"

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v15
        with:
          name: papermario-dx-aarch64-darwin
          authToken: "${{ secrets.PAPERMARIO_DX_AARCH64_DARWIN_CACHIX_AUTH_TOKEN }}"

      - name: Build aarch64-darwin toolchain
        working-directory: papermario-dx
        run: nix build .#unix-toolchain --out-link result-toolchain-aarch64-darwin

      - name: Publish to S3
        working-directory: papermario-dx
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          bucket="s3://starhaven/papermario-dx"
          file=$(echo result-toolchain-aarch64-darwin/papermario-dx-*.zip)
          hash=$(sha256sum "$file" | cut -d' ' -f1)
          if ! aws s3api head-object --bucket starhaven --key "papermario-dx/toolchains/$hash.zip" --endpoint-url "$S3_ENDPOINT" >/dev/null 2>&1; then
            aws s3 cp "$file" "$bucket/toolchains/$hash.zip" --endpoint-url "$S3_ENDPOINT"
          fi
          echo "$hash" | aws s3 cp - "$bucket/commits/$SHA/macos-aarch64" --endpoint-url "$S3_ENDPOINT"
